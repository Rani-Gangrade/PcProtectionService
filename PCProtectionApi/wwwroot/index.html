<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Protection Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .metric-icon {
            width: 24px;
            height: 24px;
            margin-right: 10px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .metric-unit {
            font-size: 1rem;
            color: #666;
        }

        .metric-details {
            font-size: 0.9rem;
            color: #888;
            margin-top: 10px;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .table-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .metrics-table th,
        .metrics-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .metrics-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .metrics-table tr:hover {
            background: #f8f9fa;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-good { background: #28a745; }
        .status-warning { background: #ffc107; }
        .status-danger { background: #dc3545; }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            margin: 20px auto;
            display: block;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5a6fd8;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .metrics-table {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ PC Protection Dashboard</h1>
            <p>Real-time System Health Monitoring</p>
        </div>

        <div class="dashboard">
            <div class="metric-card">
                <div class="metric-title">
                    <div class="metric-icon">💻</div>
                    CPU Utilization
                </div>
                <div class="metric-value" id="cpuValue">--</div>
                <div class="metric-unit">%</div>
                <div class="metric-details" id="cpuDetails">Last updated: --</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">
                    <div class="metric-icon">🧠</div>
                    Memory Usage
                </div>
                <div class="metric-value" id="memoryValue">--</div>
                <div class="metric-unit">%</div>
                <div class="metric-details" id="memoryDetails">Last updated: --</div>
            </div>

            <div class="metric-card">
                <div class="metric-title">
                    <div class="metric-icon">🔒</div>
                    Security Events
                </div>
                <div class="metric-value" id="securityValue">--</div>
                <div class="metric-unit">events</div>
                <div class="metric-details" id="securityDetails">Last updated: --</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadMetrics()">🔄 Refresh Data</button>

        <div class="table-container">
            <div class="table-title">📊 Recent System Metrics</div>
            <div id="loadingMessage" class="loading">Loading metrics...</div>
            <div id="errorMessage" class="error" style="display: none;"></div>
            <table class="metrics-table" id="metricsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>CPU %</th>
                        <th>Memory %</th>
                        <th>Memory Used</th>
                        <th>Security Event</th>
                        <th>Hostname</th>
                    </tr>
                </thead>
                <tbody id="metricsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5104/api';

        async function loadMetrics() {
            try {
                console.log('Loading metrics from:', `${API_BASE_URL}/analytics`);
                document.getElementById('loadingMessage').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('metricsTable').style.display = 'none';

                const response = await fetch(`${API_BASE_URL}/analytics`);
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const metrics = await response.json();
                console.log('Received metrics:', metrics);
                
                if (metrics && metrics.length > 0) {
                    updateDashboard(metrics);
                    updateTable(metrics);
                } else {
                    throw new Error('No metrics data available');
                }

                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('metricsTable').style.display = 'table';

            } catch (error) {
                console.error('Error loading metrics:', error);
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorMessage').textContent = `Error loading data: ${error.message}`;
            }
        }

        function updateDashboard(metrics) {
            const latest = metrics[0];
            const now = new Date().toLocaleTimeString();

            // Update CPU
            document.getElementById('cpuValue').textContent = latest.cpuUtilization.toFixed(1);
            document.getElementById('cpuDetails').textContent = `Last updated: ${now}`;

            // Update Memory
            document.getElementById('memoryValue').textContent = latest.memoryUtilization.toFixed(1);
            document.getElementById('memoryDetails').textContent = `Last updated: ${now}`;

            // Update Security Events
            const securityEvents = metrics.filter(m => m.securityEventType && m.securityEventType !== 'None').length;
            document.getElementById('securityValue').textContent = securityEvents;
            document.getElementById('securityDetails').textContent = `Last updated: ${now}`;
        }

        function updateTable(metrics) {
            const tbody = document.getElementById('metricsTableBody');
            tbody.innerHTML = '';

            metrics.forEach(metric => {
                const row = document.createElement('tr');
                
                const time = new Date(metric.collectedAt).toLocaleString();
                const cpuStatus = getStatusClass(metric.cpuUtilization, 80, 90);
                const memoryStatus = getStatusClass(metric.memoryUtilization, 80, 90);
                const securityStatus = metric.securityEventType && metric.securityEventType !== 'None' ? 'status-danger' : 'status-good';

                row.innerHTML = `
                    <td>${time}</td>
                    <td><span class="status-indicator ${cpuStatus}"></span>${metric.cpuUtilization.toFixed(1)}%</td>
                    <td><span class="status-indicator ${memoryStatus}"></span>${metric.memoryUtilization.toFixed(1)}%</td>
                    <td>${metric.memoryUsedMb}MB / ${metric.memoryTotalMb}MB</td>
                    <td><span class="status-indicator ${securityStatus}"></span>${metric.securityEventType || 'None'}</td>
                    <td>${metric.hostname}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function getStatusClass(value, warningThreshold, dangerThreshold) {
            if (value >= dangerThreshold) return 'status-danger';
            if (value >= warningThreshold) return 'status-warning';
            return 'status-good';
        }

        // Load metrics on page load
        document.addEventListener('DOMContentLoaded', loadMetrics);

        // Auto-refresh every 30 seconds
        setInterval(loadMetrics, 30000);
    </script>
</body>
</html>
